projeto_prod:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_DEV_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DEV_SCHEMA') }}"
      threads: 4
      keyfile: "{{ env_var('GCP_DEV_KEY_FILE_PATH') }}"
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROD_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_PROD_SCHEMA') }}"
      threads: 4
      keyfile: "{{ env_var('GCP_PROD_KEY_FILE_PATH') }}"
